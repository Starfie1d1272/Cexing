{
  "proxies": [
    {
      "name": "美国 SYN merge",
      "type": "socks5",
      "server": "192.0.2.10",
      "port": 1088
    }
  ],
  "proxy-groups": [
    {
      "name": "Synthetic merge selector",
      "type": "select",
      "proxies": [
        "美国 SYN merge"
      ]
    }
  ],
  "listeners": [
    {
      "name": "Synthetic listener",
      "type": "socks",
      "port": 1089,
      "listen": "127.0.0.1"
    }
  ],
  "rules": [
    "MATCH,Synthetic merge selector"
  ],
  "tun": {
    "mtu": 1500,
    "stack": "mixed"
  },
  "profile": {
    "store-selected": true
  },
  "dns": {
    "enable": true,
    "nameserver": [
      "192.0.2.53"
    ],
    "fallback": null,
    "fake-ip-filter": [
      "synthetic.example"
    ],
    "nameserver-policy": {
      "new.example": "198.51.100.53"
    },
    "fallback-filter": {
      "geoip": false
    }
  },
  "hosts": {
    "new.example": "198.51.100.2"
  }
}
