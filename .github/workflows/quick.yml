name: Quick
on:
  pull_request:
  push:
    branches: [main, ci/reproducible-build]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quick-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quick:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.11.1'
      - name: Set verified public archive cache
        run: echo "CI_GO_DOWNLOAD_CACHE=$RUNNER_TEMP/public-go-downloads" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/public-go-downloads
          key: public-go-downloads-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('core/go.mod', 'core/go.sum', 'scripts/ci/toolchain.json') }}
      - run: npm ci --prefix scripts/ci --ignore-scripts --no-audit --no-fund
      - run: bash scripts/ci/quick.sh
