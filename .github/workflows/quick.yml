name: Quick
on:
  pull_request:
  push:
    branches: [main, ci/reproducible-build]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quick-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quick:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.11.1'
      - name: Check Python script formatting and lint
        run: |
          python3 -m venv "$RUNNER_TEMP/ruff-venv"
          "$RUNNER_TEMP/ruff-venv/bin/pip" install ruff==0.17.4 clang-format==20.1.8
          git ls-files 'scripts/*.py' 'scripts/**/*.py' | grep -v '/test-' | xargs -r "$RUNNER_TEMP/ruff-venv/bin/ruff" format --check
          git ls-files 'scripts/*.py' 'scripts/**/*.py' | grep -v '/test-' | xargs -r "$RUNNER_TEMP/ruff-venv/bin/ruff" check --select E9,F63,F7,F82
      - name: Check native bridge formatting
        run: |
          git ls-files 'cexing/entry/src/main/cpp/*.cpp' 'cexing/entry/src/main/cpp/*.h' | xargs -r "$RUNNER_TEMP/ruff-venv/bin/clang-format" --dry-run --Werror
      - name: Check Go source formatting
        shell: bash
        run: |
          unformatted=$(git ls-files "core/*.go" "scripts/ci/*.go" | grep -v "_test.go$" | xargs -r gofmt -l)
          if [ -n "$unformatted" ]; then
            printf "Go files need gofmt:\n%s\n" "$unformatted"
            exit 1
          fi
      - name: Set verified public archive cache
        run: echo "CI_GO_DOWNLOAD_CACHE=$RUNNER_TEMP/public-go-downloads" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/public-go-downloads
          key: public-go-downloads-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('core/go.mod', 'core/go.sum', 'scripts/ci/toolchain.json') }}
      - run: npm ci --prefix scripts/ci --ignore-scripts --no-audit --no-fund
      - run: bash scripts/ci/quick.sh
