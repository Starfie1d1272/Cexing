name: Full (authorized SDK)
on:
  workflow_dispatch:
    inputs:
      authorized_sdk:
        description: 'HarmonyOS SDK license accepted for this build environment'
        type: boolean
        required: true
        default: false
      reviewed_sha:
        description: 'Full 40-character SHA reviewed for this manual build'
        type: string
        required: true
      runner:
        description: 'GitHub-hosted by default; preinstalled authorized SDK is optional'
        type: choice
        options: [github-hosted, self-hosted]
        default: github-hosted
permissions:
  contents: read
concurrency:
  group: full-${{ github.ref }}
  cancel-in-progress: false
jobs:
  full:
    if: github.repository == 'Starfie1d1272/Cexing' && github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/')
    # Never attach this runner to pull_request / pull_request_target events.
    runs-on: ${{ inputs.runner == 'self-hosted' && fromJSON('["self-hosted", "linux", "x64", "harmonyos-ci"]') || 'ubuntu-24.04' }}
    environment: harmonyos-ci
    timeout-minutes: 60
    env:
      AUTHORIZED_SDK: ${{ inputs.authorized_sdk }}
    steps:
      - name: Require reviewed commit and SDK authorization
        env:
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
        run: |
          [[ "$REVIEWED_SHA" =~ ^[0-9a-f]{40}$ ]] && [[ "$REVIEWED_SHA" == "$GITHUB_SHA" ]] || {
            echo '::error::Dispatch must name the full reviewed SHA of the selected branch'; exit 1;
          }
          [[ "$AUTHORIZED_SDK" == true ]] || {
            echo '::error::Accept the SDK license for this environment before dispatch'; exit 1;
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set disposable public cache and timing paths
        run: |
          echo "CI_GO_DOWNLOAD_CACHE=$RUNNER_TEMP/public-go-downloads" >> "$GITHUB_ENV"
          echo "CI_TIMINGS_FILE=$RUNNER_TEMP/build-timings.jsonl" >> "$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.11.1'
      - name: Set selected Node home
        run: |
          selected_node_home="$(dirname "$(dirname "$(command -v node)")")"
          echo "NODE_HOME=$selected_node_home" >> "$GITHUB_ENV"
          echo "DEVECO_NODE_HOME=$selected_node_home" >> "$GITHUB_ENV"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: inputs.runner != 'self-hosted'
        with:
          distribution: temurin
          java-version: '27'
      - name: Install Linux SDK runtime dependencies
        if: inputs.runner != 'self-hosted'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends unzip libgl1 libegl1 libgles2 libglib2.0-0t64 libx11-6 libxext6 libxrender1 libxi6 libxrandr2 libgbm1 fontconfig
      - name: Prepare pinned HarmonyOS CLI and SDK
        if: inputs.runner != 'self-hosted'
        env:
          HARMONYOS_CLT_URL: ${{ secrets.HARMONYOS_CLT_URL }}
        run: python3 scripts/ci/timed.py sdk-prepare python3 scripts/ci/setup-clt.py
      # Only public Go download archives and fully hash-verified panel resources.
      # Never cache the SDK, credentials, extracted modules, Go build cache or HAPs.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/public-go-downloads
          key: public-go-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('core/go.sum', 'scripts/ci/toolchain.json') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cexing/entry/src/main/resources/rawfile/zashboard
          key: verified-zashboard-${{ runner.os }}-${{ hashFiles('third_party/zashboard/**', 'scripts/build-zashboard.sh', 'scripts/zashboard-assets.py', 'scripts/ci/package-lock.json') }}
      - run: npm ci --prefix scripts/ci --ignore-scripts --no-audit --no-fund
      - name: Fresh Go, NAPI, ArkTS and verified unsigned HAP
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/timed.py full bash scripts/ci/full.sh
      - name: Prepare verified unsigned test package
        run: |
          python3 - <<'PYCODE'
          import hashlib, json, os, pathlib, shutil
          report = pathlib.Path('cexing/dist/ci')
          identity = json.loads((report / 'build-identity.json').read_text())
          hap = pathlib.Path('cexing/entry/build/default/outputs/default/entry-default-unsigned.hap')
          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()
          if identity['commit'] != os.environ['GITHUB_SHA'] or identity['signed'] is not False:
              raise SystemExit('Artifact identity does not match this unsigned CI build')
          if sha(hap) != identity['hapSha256']:
              raise SystemExit('Artifact HAP differs from the verified CI output')
          shutil.copyfile(hap, report / 'entry-default-unsigned.hap')
          source = f'https://github.com/{os.environ["GITHUB_REPOSITORY"]}/blob/{os.environ["GITHUB_SHA"]}'
          guide = f"""# HoKit 安装提示

          本包是本次提交 `{os.environ['GITHUB_SHA']}` 的未签名测试 HAP，CI 未签名、未安装或做真机验证。

          1. 解压 Artifact，在同一目录执行 `sha256sum -c SHA256SUMS`（macOS 可用 `shasum -a 256 -c SHA256SUMS`）。
          2. 在用户自己的本地 HoKit 中选择 `entry-default-unsigned.hap`，按 HoKit 提示完成授权、签名及安装。
          3. 个人签名材料和设备授权只在用户本地处理，不能上传到本仓库或 Actions。

          完整要求见 [设备指南]({source}/docs/how-to/device.md)。安装成功不证明 VPN 或后台运行通过验收。
          """
          (report / 'HOKIT-QUICKSTART.md').write_text(guide)
          shutil.copyfile('THIRD_PARTY_NOTICES.md', report / 'THIRD_PARTY_NOTICES.md')
          shutil.copyfile('LICENSE', report / 'LICENSE')
          shutil.copyfile('core/patches/NOTICE.md', report / 'SMART-NOTICE.md')
          shutil.copyfile('third_party/smart-model/source.json', report / 'SMART-MODEL-SOURCE.json')
          shutil.copyfile('core/patches/smart-offline.patch', report / 'SMART-PATCH.patch')
          files = ['entry-default-unsigned.hap', 'build-identity.json', 'module-notices.json', 'GO-NOTICES.txt', 'HOKIT-QUICKSTART.md', 'THIRD_PARTY_NOTICES.md', 'LICENSE', 'SMART-NOTICE.md', 'SMART-MODEL-SOURCE.json', 'SMART-PATCH.patch']
          (report / 'SHA256SUMS').write_text(''.join(sha(report / name) + '  ' + name + '\n' for name in files))
          PYCODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cexing-unsigned-hap-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            cexing/dist/ci/entry-default-unsigned.hap
            cexing/dist/ci/build-identity.json
            cexing/dist/ci/module-notices.json
            cexing/dist/ci/GO-NOTICES.txt
            cexing/dist/ci/HOKIT-QUICKSTART.md
            cexing/dist/ci/SHA256SUMS
            cexing/dist/ci/THIRD_PARTY_NOTICES.md
            cexing/dist/ci/LICENSE
            cexing/dist/ci/SMART-NOTICE.md
            cexing/dist/ci/SMART-MODEL-SOURCE.json
            cexing/dist/ci/SMART-PATCH.patch
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Download uploaded test package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cexing-unsigned-hap-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verified-download
      - name: Verify downloaded package identity and checksums
        run: |
          cd "$RUNNER_TEMP/verified-download"
          sha256sum -c SHA256SUMS
          python3 - <<'PYCODE'
          import hashlib, json, os, pathlib
          downloaded = pathlib.Path('.')
          identity = json.loads((downloaded / 'build-identity.json').read_text())
          hap = downloaded / 'entry-default-unsigned.hap'
          if identity['commit'] != os.environ['GITHUB_SHA'] or identity['signed'] is not False:
              raise SystemExit('Downloaded package has wrong build identity')
          if hashlib.sha256(hap.read_bytes()).hexdigest() != identity['hapSha256']:
              raise SystemExit('Downloaded HAP differs from recorded identity')
          print('PASS: downloaded unsigned artifact SHA and commit identity')
          PYCODE
      - name: Upload phase timings (also on failure)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-timings-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/build-timings.jsonl
          if-no-files-found: ignore
          retention-days: 7
