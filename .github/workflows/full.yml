name: Full (authorized SDK)
on:
  workflow_dispatch:
    inputs:
      authorized_sdk:
        description: 'Official SDK license accepted on a trusted disposable runner'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: full-${{ github.ref }}
  cancel-in-progress: false
jobs:
  full:
    if: inputs.authorized_sdk && github.repository == 'Starfie1d1272/clash-OpenHarmony'
    # Never attach this runner to pull_request / pull_request_target events.
    runs-on: [self-hosted, linux, x64, harmonyos-ci]
    environment: harmonyos-ci
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.2'
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26.11.1'
      # Runner provisions JDK 27, CLT and optional public wrapper/tools seed.
      # No SDK downloads, signing secrets, private configuration, or device access.
      - run: npm ci --prefix scripts/ci --ignore-scripts --no-audit --no-fund
      - run: bash scripts/ci/full.sh
      - name: Prepare verified unsigned test package
        run: |
          python3 - <<'PYCODE'
          import hashlib, json, os, pathlib, shutil
          report = pathlib.Path('clash-openharmony/dist/ci')
          identity = json.loads((report / 'build-identity.json').read_text())
          hap = pathlib.Path('clash-openharmony/entry/build/default/outputs/default/entry-default-unsigned.hap')
          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()
          if identity['commit'] != os.environ['GITHUB_SHA'] or identity['signed'] is not False:
              raise SystemExit('Artifact identity does not match this unsigned CI build')
          if sha(hap) != identity['hapSha256']:
              raise SystemExit('Artifact HAP differs from the verified CI output')
          shutil.copyfile(hap, report / 'entry-default-unsigned.hap')
          source = f'https://github.com/{os.environ["GITHUB_REPOSITORY"]}/blob/{os.environ["GITHUB_SHA"]}/docs/'
          guide = pathlib.Path('docs/how-to/device.md').read_text()
          guide = guide.replace('../reference/smart-beta.md', source + 'reference/smart-beta.md')
          guide = guide.replace('../evidence/native-ui/DEVICE-CHECKLIST.md', source + 'evidence/native-ui/DEVICE-CHECKLIST.md')
          (report / 'HOKIT-QUICKSTART.md').write_text(guide)
          files = ['entry-default-unsigned.hap', 'build-identity.json', 'module-notices.json', 'HOKIT-QUICKSTART.md']
          (report / 'SHA256SUMS').write_text(''.join(sha(report / name) + '  ' + name + '\n' for name in files))
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-test-hap-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            clash-openharmony/dist/ci/entry-default-unsigned.hap
            clash-openharmony/dist/ci/build-identity.json
            clash-openharmony/dist/ci/module-notices.json
            clash-openharmony/dist/ci/HOKIT-QUICKSTART.md
            clash-openharmony/dist/ci/SHA256SUMS
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
