name: Release unsigned HAP
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing vMAJOR.MINOR.PATCH tag to build (does not move or create tags)'
        required: true
        type: string
      expected_sha:
        description: 'Reviewed full commit SHA of that tag'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  resolve:
    if: github.repository == 'Starfie1d1272/Cexing' && (github.event_name == 'push' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      sha: ${{ steps.source.outputs.sha }}
      tree: ${{ steps.source.outputs.tree }}
      version_code: ${{ steps.source.outputs.version_code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Resolve immutable tag and validate app version
        id: source
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          EXPECTED_SHA: ${{ inputs.expected_sha || github.sha }}
        run: python3 scripts/ci/release.py resolve
  build:
    needs: resolve
    uses: ./.github/workflows/full.yml
    with:
      authorized_sdk: true
      reviewed_sha: ${{ needs.resolve.outputs.sha }}
      runner: github-hosted
      release_tag: ${{ needs.resolve.outputs.tag }}
    secrets:
      HARMONYOS_CLT_URL: ${{ secrets.HARMONYOS_CLT_URL }}
  publish:
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The only write token: create/update this Release and upload its assets.
    # Build and dependency execution have contents:read and never receive it.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ runner.temp }}/release
          merge-multiple: true
      - name: Verify this run's artifact, publish without replacement, verify public assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
          SOURCE_TREE: ${{ needs.resolve.outputs.tree }}
          VERSION_CODE: ${{ needs.resolve.outputs.version_code }}
          BUILD_ATTEMPT: ${{ needs.build.outputs.build_attempt }}
        run: python3 scripts/ci/release.py publish "$RUNNER_TEMP/release"
