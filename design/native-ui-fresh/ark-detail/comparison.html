<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>轻盈基线与 Ark 细节对照</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 28px;
        background: #eaf0f3;
        color: #23323a;
        font-family: system-ui, "Noto Sans CJK SC", sans-serif;
      }
      main {
        max-width: 1980px;
        margin: auto;
      }
      header {
        margin: 0 auto 24px;
        max-width: 804px;
      }
      h1 {
        font-size: 24px;
        margin: 0 0 10px;
      }
      p {
        font-size: 13px;
        color: #5b6e79;
        line-height: 1.8;
        margin: 0;
      }
      label {
        font-size: 13px;
        margin-right: 8px;
      }
      select {
        font: inherit;
        background: white;
        border: 1px solid #c9d9e2;
        border-radius: 12px;
        padding: 10px;
        min-height: 44px;
        margin: 16px 18px 0 0;
      }
      .pair {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 24px;
        margin: auto;
        max-width: 804px;
      }
      .pair h2 {
        font-size: 15px;
        font-weight: 550;
        margin: 0 0 12px;
      }
      .pair img {
        width: 100%;
        height: auto;
        display: block;
        box-shadow: 0 8px 24px #23374708;
      }
      a {
        color: #006e89;
      }
      footer {
        margin: 20px auto;
        max-width: 804px;
        font-size: 13px;
        line-height: 1.9;
      }
      select:focus-visible,
      a:focus-visible {
        outline: 3px solid #007b99;
        outline-offset: 3px;
      }
      @media (max-width: 700px) {
        body {
          padding: 20px 12px;
        }
        .pair {
          gap: 12px;
        }
        h1 {
          font-size: 21px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1 id="title">连接 · 同尺寸前后对照</h1>
        <p>
          同一份示例数据，同一窗口。左侧保留 9127864 轻盈基线；右侧为新增 Ark
          细节试稿。
        </p>
        <div id="controls">
          <label for="page">页面</label
          ><select id="page">
            <option value="connected">连接</option>
            <option value="profiles">订阅</option>
            <option value="settings">设置</option></select
          ><label for="size">窗口</label
          ><select id="size">
            <option>390x844</option>
            <option>960x720</option>
          </select>
        </div>
      </header>
      <section class="pair">
        <div>
          <h2>前 · 9127864 轻盈基线</h2>
          <a id="before-link"
            ><img id="before" alt="基线相同数据和视口截图"
          /></a>
        </div>
        <div>
          <h2>后 · Ark 细节试稿</h2>
          <a id="after-link"
            ><img id="after" alt="Ark试稿相同数据和视口截图"
          /></a>
        </div>
      </section>
      <footer id="footer">
        <p id="caption"></p>
        <a
          id="baseline-run"
          href="../baseline-9127864/index.html?state=connected"
          >运行冻结基线</a
        >
        · <a id="ark-run" href="../ark.html?state=connected">运行试稿</a> ·
        <a href="../review.html">切换交互评审</a> ·
        <a href="README.md">变化与验证</a>
      </footer>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      document.getElementById("page").value = params.get("page") || "connected";
      document.getElementById("size").value = params.get("size") || "390x844";
      function update() {
        const state = document.getElementById("page").value,
          size = document.getElementById("size").value;
        const labels = {
          connected: "连接",
          profiles: "订阅",
          settings: "设置",
        };
        document.getElementById("title").textContent =
          `${labels[state]} · ${size.replace("x", " × ")} 同尺寸对照`;
        for (const side of ["before", "after"]) {
          const file = `screenshots/${side}/${state}-${size}.png`;
          document.getElementById(side).src = file;
          document.getElementById(side + "-link").href = file;
        }
        document.getElementById("baseline-run").href =
          `../baseline-9127864/index.html?state=${state}`;
        document.getElementById("ark-run").href = `../ark.html?state=${state}`;
        document.getElementById("caption").textContent =
          `两侧为 ${size.replace("x", " × ")} CSS px 的实际浏览器截图；文本与状态快照检查一致。`;
        document.querySelector(".pair").style.maxWidth =
          size === "960x720" ? "1944px" : "804px";
      }
      for (const id of ["page", "size"])
        document.getElementById(id).addEventListener("change", update);
      if (params.has("capture"))
        document.getElementById("controls").hidden = true;
      update();
    </script>
  </body>
</html>
