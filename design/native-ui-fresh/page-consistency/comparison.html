<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>页面一致性 · 逐页对照</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:28px;background:#eaf0f3;color:#23323a;font-family:system-ui,'Noto Sans CJK SC',sans-serif}header,footer{max-width:804px;margin:0 auto 24px}h1{font-size:24px;margin:0 0 10px}p,footer{font-size:13px;line-height:1.8;color:#5b6e79}select{font:inherit;background:#fff;border:1px solid #c9d9e2;border-radius:12px;min-height:48px;padding:10px;max-width:100%}.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;max-width:804px;margin:auto}h2{font-size:15px;font-weight:550;margin:0 0 12px}img{width:100%;height:auto;display:block}a{color:#006e89}footer{margin-top:20px}select:focus-visible,a:focus-visible{outline:3px solid #007b99;outline-offset:3px}@media(max-width:700px){body{padding:20px 12px}.pair{gap:12px}h1{font-size:21px}}
</style></head><body><header><h1>逐页同状态对照 · 390 × 844</h1><p>左：已选 0974f9d。右：只修间隔选择器与删除操作色。其他页面保持。</p><label for="page">页面／状态</label> <select id="page"></select></header><main class="pair"><section><h2>前 · 0974f9d</h2><a id="before-link"><img id="before" alt="前稿截图"></a></section><section><h2>后 · 页面一致性修整</h2><a id="after-link"><img id="after" alt="修整后同状态截图"></a></section></main><footer><a href="index.html?state=connected">运行当前原型</a> · <a href="README.md">页面结论与实现差距</a></footer>
<script>
const pages={"settings-interval":"调整 · 设置／自动更新间隔","profile-delete":"调整 · 订阅详情／删除入口","delete-dialog":"调整 · 删除确认","connected":"保持 · 已选首页","ready":"保持 · 未连接","permission":"保持 · 系统授权示意","disconnect":"保持 · 断开确认","profiles":"保持 · 订阅列表","settings":"保持 · 设置默认","profile":"订阅详情默认","import":"保持 · 链接导入","import-error":"保持 · 导入失败","review":"保持 · 导入确认","overrides":"保持 · 覆写选择","merge":"保持 · Merge 编辑","network":"保持 · 网络设置","kernel":"保持 · 内核设置","diagnostics":"保持 · 诊断","panel":"保持 · 面板接入预览","panel-error":"保持 · 面板失败","update-error":"订阅更新失败","access":"保持 · 分流选择","diff":"保持 · 差异预览","rename":"保持 · 重命名","file":"保持 · 文件导入","clipboard":"保持 · 剪贴板导入"};
const select=document.getElementById('page');for(const [id,label] of Object.entries(pages)){const option=document.createElement('option');option.value=id;option.textContent=label;select.append(option)}select.value=new URLSearchParams(location.search).get('page')||'settings-interval';
function update(){for(const side of ['before','after']){const src=`screenshots/${side}/${select.value}-390x844.png`;document.getElementById(side).src=src;document.getElementById(side+'-link').href=src;document.getElementById(side).alt=pages[select.value]+(side==='before'?'前稿':'修整后')} }select.addEventListener('change',update);update();
</script></body></html>
